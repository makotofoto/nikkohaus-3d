<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>日光小室 3D 看棚</title>
<style>
  :root { --bg:#ecebe8; --fg:#2a2826; --dim:rgba(42,40,38,.6); --panel:rgba(255,255,255,.74); --line:rgba(0,0,0,.1); --acc:#e0a63a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; -webkit-user-select:none; user-select:none; }
  [hidden] { display:none !important; }
  canvas { display:block; touch-action:none; position:fixed; inset:0; }
  #hud { position:fixed; left:16px; top:calc(16px + env(safe-area-inset-top, 0px)); right:16px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; gap:12px; }
  #title { font-size:15px; letter-spacing:.08em; font-weight:600; }
  #title small { display:block; color:var(--dim); font-size:12px; margin-top:4px; letter-spacing:0; font-weight:400; }
  .btns { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; }
  button { background:var(--panel); color:var(--fg); border:1px solid rgba(0,0,0,.12); border-radius:999px;
    padding:8px 14px; font:inherit; font-size:13px; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  button.on { background:var(--fg); color:#fff; }
  #help { position:fixed; left:16px; bottom:20px; pointer-events:none; background:var(--panel); padding:8px 14px; border-radius:10px;
    font-size:12px; color:var(--dim); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); white-space:nowrap; transition:opacity .6s; }
  #stick { position:fixed; left:28px; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); width:110px; height:110px; border-radius:50%; border:1px solid rgba(0,0,0,.15);
    background:rgba(255,255,255,.35); display:none; touch-action:none; }
  #knob { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(42,40,38,.6); }
  body.walk #stick { display:block; }
  /* 光線面板 */
  #panel { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:300px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px 12px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,.08); max-height:calc(100% - 110px); overflow:auto; }
  #panel h3 { margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; }
  #panel h3 button { padding:3px 10px; font-size:12px; }
  .row { margin:9px 0; }
  .row label { display:flex; justify-content:space-between; color:var(--dim); margin-bottom:4px; }
  .row label b { color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; margin:0; accent-color:var(--acc); }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .chips button { padding:3px 9px; font-size:11px; }
  .seg { display:flex; gap:5px; }
  .seg button { flex:1; padding:5px 0; font-size:12px; }
  #info { margin-top:10px; padding-top:9px; border-top:1px solid var(--line); color:var(--dim); line-height:1.6; font-variant-numeric:tabular-nums; }
  #info .hit { color:#b57a10; font-weight:600; }
  #panelBtn { display:none; }
  /* 擺設 */
  body.edit #panel { display:none; }
  body.edit #hOrbit, body:not(.edit) #hEdit { display:none; }
  body.edit #help { left:50%; transform:translateX(-50%); bottom:auto; top:calc(96px + env(safe-area-inset-top, 0px)); opacity:1 !important; }
  #editBar { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  #editBar > div { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:6px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 24px rgba(0,0,0,.08); }
  #editBar button { padding:7px 13px; }
  #selBar b { font-size:13px; font-weight:600; padding:0 6px 0 8px; }
  #storeIt { color:#9a3b2a; }
  #storeList { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom, 0px)); width:min(340px, calc(100% - 24px));
    max-height:50vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 24px rgba(0,0,0,.1); font-size:13px; }
  #storeList h3 { margin:0 0 8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  #storeList h3 button { padding:3px 10px; font-size:12px; }
  #storeItems { display:flex; flex-direction:column; gap:6px; }
  #storeItems button { display:flex; justify-content:space-between; border-radius:10px; text-align:left; }
  #storeItems button span { color:#b57a10; font-size:12px; }
  #storeItems p { margin:4px 0; color:var(--dim); line-height:1.5; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); top:calc(140px + env(safe-area-inset-top, 0px)); max-width:calc(100% - 32px);
    background:rgba(42,40,38,.88); color:#fff; padding:9px 14px; border-radius:10px; font-size:13px; line-height:1.5; z-index:5; }
  #toast input { width:100%; margin-top:6px; font:inherit; font-size:12px; padding:4px 6px; border-radius:6px; border:0; }
  #photo { position:fixed; inset:0; z-index:10; background:rgba(20,19,18,.82); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px 16px; color:#fff; font-size:13px; }
  #photo img { max-width:100%; max-height:75vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  #photo a { color:#2a2826; background:#fff; padding:8px 16px; border-radius:999px; text-decoration:none; }
  /* 背景音樂 */
  #mMusic.playing .note { color:var(--acc); }
  #musicPanel { position:fixed; right:16px; top:calc(108px + env(safe-area-inset-top, 0px)); width:270px; z-index:4; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 24px rgba(0,0,0,.1); font-size:12px; }
  #musicPanel h3 { margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; }
  #musicPanel h3 button { padding:3px 10px; font-size:12px; }
  #musicSeg { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #musicSeg button { border-radius:12px; padding:8px 10px; text-align:left; font-size:13px; }
  #musicSeg button small { display:block; font-size:11px; color:var(--dim); margin-top:2px; }
  #musicSeg button.on small { color:rgba(255,255,255,.7); }
  #musicSeg button[data-p=off] { grid-column:1 / -1; text-align:center; padding:6px; }
  #musicPanel label { display:flex; align-items:center; gap:10px; margin-top:12px; color:var(--dim); white-space:nowrap; }
  #musicPanel .note { margin:8px 0 0; color:var(--dim); font-size:11px; }
  @media (pointer:fine) { body.walk #stick { display:none; } .touch { display:none; } }
  @media (pointer:coarse) { .desk { display:none; } }
  @media (max-width:700px) {
    #panel { left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:auto; max-height:62vh; overflow:auto; }
    body.panelClosed #panel { display:none; }
    #panelBtn { display:inline-block; }
    #help { left:50%; transform:translateX(-50%); bottom:auto; top:calc(96px + env(safe-area-inset-top, 0px)); }
    #musicPanel { left:12px; right:12px; width:auto; top:calc(100px + env(safe-area-inset-top, 0px)); }
    body.walk:not(.panelClosed) #stick { display:none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div id="title">nikkohaus<small>日光小室 · 窗朝南 · 500 × 1000 cm · 高 330 cm</small></div>
  <div class="btns">
    <button id="mOrbit" class="on">俯瞰</button>
    <button id="mWalk">走進去</button>
    <button id="mTour">導覽</button>
    <button id="mEdit">擺設</button>
    <button id="mPhoto">拍照</button>
    <button id="mMusic"><span class="note">♪</span> 音樂</button>
    <button id="panelBtn">☀ 光線</button>
  </div>
</div>
<div id="help">
  <span id="hOrbit"><span class="desk">拖曳旋轉 · 滾輪縮放 · 右鍵平移</span><span class="touch">單指旋轉 · 雙指縮放</span></span>
  <span id="hEdit">點家具選取 · 拖曳移動 · 點空白處取消選取</span>
  <span id="hWalk" hidden><span class="desk">拖曳轉頭 · W A S D／方向鍵移動</span><span class="touch">右邊拖曳轉頭 · 左下搖桿移動</span></span>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="editBar" hidden>
  <div id="selBar" hidden><b id="selName"></b><button id="rot90">轉 90°</button><button id="rot15">轉 15°</button><button id="storeIt">收起</button></div>
  <div><button id="storeBtn">倉庫<span id="storeCount"></span></button><button id="resetBtn">還原</button><button id="shareBtn">分享擺法</button><button id="doneBtn" class="on">完成</button></div>
</div>
<div id="storeList" hidden><h3>倉庫 <button id="storeClose">關閉</button></h3><div id="storeItems"></div></div>
<div id="toast" hidden></div>
<div id="musicPanel" hidden>
  <h3>背景音樂 <button id="musicClose">關閉</button></h3>
  <div id="musicSeg">
    <button data-p="off">關</button>
    <button data-p="light">光線連動<small>跟著日期、時間、天氣變</small></button>
    <button data-p="cafe">咖啡廳<small>爵士鋼琴、杯盤聲</small></button>
    <button data-p="market">市集<small>撥弦吉他、熱鬧人聲</small></button>
    <button data-p="morning">假日清晨<small>音樂盒、鳥叫、微風</small></button>
  </div>
  <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05"></label>
  <p class="note">iPhone 要關掉靜音模式才聽得到</p>
</div>
<div id="photo" hidden><img id="photoImg" alt="棚內照片"><span>手機請長按圖片儲存 · 點空白處關閉</span><a id="photoDl" href="#">下載照片</a></div>
<div id="panel">
  <h3>光線 <button id="panelClose" class="touch">收起</button></h3>
  <div class="row">
    <label>日期 <b id="vDate"></b></label>
    <input id="date" type="range" min="1" max="365" step="1">
    <div class="chips">
      <button data-doy="80">春分</button><button data-doy="172">夏至</button><button data-doy="266">秋分</button><button data-doy="356">冬至</button><button data-doy="today">今天</button>
    </div>
  </div>
  <div class="row">
    <label>時間 <b id="vTime"></b></label>
    <input id="time" type="range" min="4.5" max="20" step="0.0833">
    <div class="chips"><button id="play">▶ 播放一天</button><button id="now">現在</button></div>
  </div>
  <div class="row">
    <label>天氣</label>
    <div class="seg" id="weather"><button data-w="clear">晴</button><button data-w="haze">薄雲</button><button data-w="overcast">陰天</button></div>
  </div>
  <div class="row">
    <label>窗戶朝向 <b id="vFace"></b></label>
    <input id="face" type="range" min="0" max="355" step="5">
  </div>
  <div class="row">
    <label>曝光補償 <b id="vEv"></b></label>
    <input id="ev" type="range" min="-2" max="2" step="0.333">
  </div>
  <div class="row">
    <label>室內燈</label>
    <div class="seg" id="lamps"><button data-l="auto">自動</button><button data-l="on">開</button><button data-l="off">關</button></div>
  </div>
  <div id="info"></div>
</div>
<script type="module" src="studio.js"></script>
</body>
</html>
